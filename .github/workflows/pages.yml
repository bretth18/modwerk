name: Build approved modules and publish Octamod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octamod-pages
  cancel-in-progress: false
jobs:
  approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify the owner merged this exact source commit
        run: node scripts/verify-merge-approval.mjs "$RUNNER_TEMP/octamod-approval.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCTAMOD_APPROVER_ID: ${{ vars.MODULE_APPROVER_GITHUB_ID }}
      - name: Rebuild modules only when module source changed since the last successful release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare with the last successful release, not the previous commit, so a failed module build is never skipped.
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          # Documentation and media of a module are not compiled (scripts/module-source.mjs), so they never need a rebuild.
          paths=(sdk ':(exclude,glob)sdk/**/*.md' ':(exclude,glob)sdk/octabam/modules/*/media/**' ':(exclude,glob)sdk/octabam/modules/*/presentation/**'
            ':(exclude,glob)sdk/octabam/modules/*/evidence/**' scripts/build-module-packages.py scripts/build-utility-packages.py scripts/build-modules-isolated.sh
            scripts/import-module-build.mjs scripts/stamp-module-build.mjs scripts/module-source.mjs scripts/license-notices.mjs scripts/licenses.mjs src/engine/assets src/release)
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null && git diff --quiet "$last" HEAD -- "${paths[@]}"; then
            echo "modules=false" >> "$GITHUB_OUTPUT"
            echo "No module change since the last successful release ($last): publishing the verified committed packages."
          else
            echo "modules=true" >> "$GITHUB_OUTPUT"
            echo "Module source changed since ${last:-the first release}: rebuilding in isolation."
          fi
  source-packages:
    needs: approval
    if: needs.approval.outputs.modules == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run modules:check
      - run: npm run licenses:check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Every toolchain input is pinned by digest or checksum, so cached layers equal a fresh build.
      # Main-branch caches cannot be written by pull requests.
      - name: Prepare the pinned patched assembler toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sdk/build/Dockerfile
          tags: octamod-source-tools
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=source-tools
          cache-to: type=gha,scope=source-tools,mode=max
      - name: Compile reviewed source without network, credentials or firmware
        run: |
          tool_image=$(docker image inspect octamod-source-tools --format '{{.Id}}')
          bash scripts/build-modules-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/octamod-output" "$tool_image"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octamod-source-${{ github.sha }}
          path: ${{ runner.temp }}/octamod-output/packages
          retention-days: 30
          if-no-files-found: error
  frontend:
    needs: [approval, source-packages]
    # A skipped module rebuild must not skip the site; a failed one must stop it.
    if: ${{ !cancelled() && needs.approval.result == 'success' && (needs.source-packages.result == 'success' || needs.source-packages.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: needs.approval.outputs.modules == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: octamod-source-${{ github.sha }}
          path: ${{ runner.temp }}/octamod-packages
      - name: Independently verify owner merge, versions, sources and artifact hashes
        if: needs.approval.outputs.modules == 'true'
        run: node scripts/import-module-build.mjs "$RUNNER_TEMP/octamod-packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCTAMOD_APPROVER_ID: ${{ vars.MODULE_APPROVER_GITHUB_ID }}
      - name: Confirm the committed packages still match their module source and record this approval
        if: needs.approval.outputs.modules != 'true'
        run: node scripts/stamp-module-build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCTAMOD_APPROVER_ID: ${{ vars.MODULE_APPROVER_GITHUB_ID }}
      # The pull request already ran lint and every test (module-pr.yml). A release re-verifies what must hold at release
      # time (generated files, licences, machine and module records, source integrity), then type-checks and bundles.
      - run: npm run licenses:check && npm run machines:check && npm run modules:check && npm run elekloader:check && npm run sdk:check
      - run: npm run build
        env:
          VITE_COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
          VITE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: frontend
    if: ${{ !cancelled() && needs.frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
