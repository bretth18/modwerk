name: Module PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: module-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  module-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require version increases against the exact PR base
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run modules:check -- --base "$OCTAMOD_PR_BASE"
      - run: npm run check
      # Metadata checks never execute submitted Python or run firmware gates.
  module-paths-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate module paths against the exact PR base
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run modules:check -- --base "$env:OCTAMOD_PR_BASE"
      - name: Check byte-exact source integrity
        run: npm run sdk:check
      - name: Exercise paths and directory junctions on Windows
        run: npm run test -- src/catalog/module-folder.test.ts
