name: Module PR checks
on:
  pull_request:
    branches: [main, 'modwerk/**', 'codex/modwerk-*']
    # Skip the module/SDK checks when a PR only touches the frontend. A PR that
    # also touches anything outside this list still runs them.
    paths-ignore:
      - 'src/components/**'
      - 'src/community/**'
      - 'src/hooks/**'
      - 'src/legal/**'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'src/styles.css'
      - 'src/**/*.css'
      - 'public/**'
      - 'index.html'
permissions:
  contents: read
concurrency:
  group: module-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  module-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      elemod: ${{ steps.source-inputs.outputs.elemod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes to Elemod source and compiler inputs
        id: source-inputs
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Compare the actual checked-out PR merge with its exact base, including removals.
          git cat-file -e "$OCTAMOD_PR_BASE^{commit}"
          inputs=(sdk/elemod sdk/digitakt sdk/digitone sdk/machines sdk/build
            sdk/octabam/scripts/vendor.sh sdk/octabam/tools/patches sdk/octabam/tools/harness/dsp_host
            'scripts/build-elemod*' scripts/elemod-elf.mjs
            src/catalog/module-contract-v3.ts src/catalog/module-folder.ts src/catalog/versions.ts
            src/devices/machine-contract.ts src/engine/elektron src/engine/assets/elemod
            package.json package-lock.json)
          # Scheduling-only workflow edits do not change the compilation. Changes to
          # the compiler job itself still require its isolated reproducibility check.
          compiler_job() {
            git show "$1:.github/workflows/module-pr.yml" |
              sed -n '/^  elemod-source:/,/^  octatrack-source:/{ /^  octatrack-source:/d; p; }' | sed '/^    needs:/d; /^    if:/d'
          }
          if git diff --quiet "$OCTAMOD_PR_BASE" HEAD -- "${inputs[@]}" &&
             cmp -s <(compiler_job "$OCTAMOD_PR_BASE") <(compiler_job HEAD); then
            echo 'elemod=false' >> "$GITHUB_OUTPUT"
            echo 'Elemod source and compiler inputs are unchanged; skipping compilation.'
          else
            echo 'elemod=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require versions, qualification evidence and complete release documentation
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run modules:check -- --base "$OCTAMOD_PR_BASE"
      - run: npm run check
      # Qualification records, complete docs/tutorials and monochrome screenshots are mandatory.
      # The owner verifies actual measurement/hardware evidence before merge.
      # Metadata checks never execute submitted Python or run firmware gates.
  module-paths-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate module paths against the exact PR base
        env:
          OCTAMOD_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run modules:check -- --base "$env:OCTAMOD_PR_BASE"
      - name: Check byte-exact source integrity
        run: npm run sdk:check
      - name: Exercise paths and directory junctions on Windows
        run: npm run test -- src/catalog/module-folder.test.ts
  core-logger-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check bounded logger ring, controller and card adapter without firmware
        run: sh sdk/runtime/logging/tests/run_host.sh
  elemod-source:
    needs: module-contract
    if: needs.module-contract.outputs.elemod == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Reuses the release workflow's cached toolchain layers; every input is pinned.
      - name: Prepare the pinned source compiler
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sdk/build/Dockerfile
          tags: modwerk-source-tools
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=source-tools
          cache-to: type=gha,scope=source-tools,mode=max
      - name: Compile twice without network, credentials or firmware
        run: |
          image=$(docker image inspect modwerk-source-tools --format '{{.Id}}')
          bash scripts/build-elemod-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/elemod-first" "$image"
          bash scripts/build-elemod-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/elemod-second" "$image"
          diff --recursive "$RUNNER_TEMP/elemod-first" "$RUNNER_TEMP/elemod-second"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elemod-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/elemod-first
          retention-days: 14
          if-no-files-found: error
  octatrack-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare pinned release toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: sdk/build/Dockerfile
          tags: modwerk-source-tools
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=source-tools
          cache-to: type=gha,scope=source-tools,mode=max
      - name: Compile authored Octatrack packages without firmware or network
        run: |
          image=$(docker image inspect modwerk-source-tools --format '{{.Id}}')
          bash scripts/build-modules-isolated.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/octatrack-source" "$image"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: octatrack-source-${{ github.sha }}
          path: ${{ runner.temp }}/octatrack-source/packages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Require compiled packages to reproduce the committed, native-verified packages
        run: node scripts/import-module-build.mjs "$RUNNER_TEMP/octatrack-source/packages" --development --check-only --verify-existing
