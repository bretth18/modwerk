<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modwerk link preview</title>
<!--
  Editable source for public/modwerk-social-preview-v2.jpg. Original vector artwork.
  The four feature branches meet at the unchanged public/modwerk-mark.svg.
  No firmware, photographs, product captures or generated images are used.
  Fonts: Archivo and JetBrains Mono, pinned @fontsource builds (SIL OFL 1.1).
-->
<style>
  @font-face { font-family: 'Archivo'; src: url(https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.3.0/files/archivo-latin-standard-normal.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'JetBrains Mono'; src: url(https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.3.0/files/jetbrains-mono-latin-wght-normal.woff2) format('woff2'); font-weight: 100 800; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #19191c; }
  svg { display: block; }
  .sans { font-family: 'Archivo', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
  aria-label="Modwerk. Mods for Elektron instruments. Four branches connect the mod library, firmware builder, community forum and developer SDK to the Modwerk mark.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#333237"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#19191c"/>
  <rect x="40" y="202" width="1120" height="370" fill="url(#grid)"/>
  <rect x="530" y="310" width="140" height="154" fill="#19191c"/>

  <!-- The header lockup and central hub both embed the unchanged mark. -->
  <image href="../../public/modwerk-mark.svg" x="42" y="44" width="82" height="82"/>
  <text x="148" y="120" class="sans" font-size="94" font-weight="720" letter-spacing="-4" fill="#ececf1" style="font-stretch:104%">Modwerk</text>
  <text x="44" y="170" class="sans" font-size="32" font-weight="460" letter-spacing="-.7" fill="#c3c3ce">Mods for Elektron instruments.</text>
  <text x="1156" y="72" text-anchor="end" class="mono" font-size="20" letter-spacing="1.6" fill="#d0a46a">MODWERK.APP</text>

  <!-- Four short, visible branches. The generous centre keeps the mark intact. -->
  <g stroke="#d0a46a" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M490 295H516Q528 295 528 307V467Q528 479 516 479H490M528 387H539"/>
    <path d="M710 295H684Q672 295 672 307V467Q672 479 684 479H710M672 387H661"/>
  </g>
  <g fill="#d0a46a">
    <circle cx="490" cy="295" r="5"/><circle cx="490" cy="479" r="5"/>
    <circle cx="710" cy="295" r="5"/><circle cx="710" cy="479" r="5"/>
  </g>

  <!-- Feature panels: labels and drawings remain independent at preview sizes. -->
  <g fill="#232326" stroke="#48474d" stroke-width="1.5">
    <rect x="40" y="218" width="450" height="154" rx="16"/>
    <rect x="710" y="218" width="450" height="154" rx="16"/>
    <rect x="40" y="402" width="450" height="154" rx="16"/>
    <rect x="710" y="402" width="450" height="154" rx="16"/>
  </g>
  <g class="sans" font-size="41" font-weight="620" letter-spacing="-1" fill="#ececf1">
    <text x="66" y="282">Mod</text><text x="66" y="326">library</text>
    <text x="878" y="282">Firmware</text><text x="878" y="326">builder</text>
    <text x="66" y="466">Community</text><text x="66" y="510">forum</text>
    <text x="878" y="466">Developer</text><text x="878" y="510">SDK</text>
  </g>

  <!-- Library: three collectible module covers, each with a distinct signal. -->
  <g stroke-width="2">
    <rect x="277" y="246" width="62" height="98" rx="6" fill="#19191c" stroke="#66636c"/>
    <rect x="342" y="238" width="62" height="98" rx="6" fill="#19191c" stroke="#929bff"/>
    <rect x="407" y="246" width="62" height="98" rx="6" fill="#19191c" stroke="#83c7bc"/>
    <path d="M286 295C294 267 298 267 307 295S320 323 330 295" fill="none" stroke="#d0a46a" stroke-width="3"/>
    <path d="M353 311V264M362 311V278M371 311V289M380 311V299M389 311V304" stroke="#929bff" stroke-width="4"/>
    <path d="M417 310V280H431V299H445V280H459V310" fill="none" stroke="#83c7bc" stroke-width="3"/>
  </g>

  <!-- Builder: selected modules combine into one firmware package. -->
  <g transform="translate(734 241)">
    <g stroke-width="2">
      <rect width="30" height="30" rx="5" fill="#302b25" stroke="#d0a46a"/>
      <rect x="43" width="30" height="30" rx="5" fill="#292a36" stroke="#929bff"/>

    <rect x="4" y="73" width="108" height="34" rx="6" fill="#19191c" stroke="#c3c3ce" stroke-width="2"/>
    <g>
      <rect x="14" y="82" width="17" height="16" rx="2" fill="#d0a46a"/>
      <rect x="37" y="82" width="17" height="16" rx="2" fill="#929bff"/>
      <rect x="60" y="82" width="17" height="16" rx="2" fill="#83c7bc"/>
      <path d="M85 89L91 95L103 84" fill="none" stroke="#ececf1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Forum: a conversation, with clear silhouettes instead of miniature text. -->
  <g transform="translate(290 428)" stroke-width="2.5" stroke-linejoin="round">
    <path d="M46 40H155Q163 40 163 48V81Q163 89 155 89H147V106L128 89H46Q38 89 38 81V48Q38 40 46 40Z" fill="#302b25" stroke="#d0a46a"/>
    <path d="M8 0H117Q125 0 125 8V44Q125 52 117 52H36L17 70V52H8Q0 52 0 44V8Q0 0 8 0Z" fill="#19191c" stroke="#ececf1"/>
    <path d="M21 19H94M21 32H71" stroke="#c3c3ce" stroke-width="4" stroke-linecap="round"/>
    <g fill="#d0a46a" stroke="none"><circle cx="98" cy="69" r="3"/><circle cx="113" cy="69" r="3"/><circle cx="128" cy="69" r="3"/></g>
  </g>

  <!-- SDK: code brackets frame a module tile, echoing the logo's incoming mod. -->
  <g transform="translate(732 427)" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 19L4 49L25 79M100 19L121 49L100 79" stroke="#ececf1"/>
    <path d="M75 8L51 91" stroke="#929bff"/>
    <rect x="90" y="84" width="22" height="22" rx="4" fill="#d0a46a" stroke="none"/>
  </g>

  <image href="../../public/modwerk-mark.svg" x="534" y="321" width="132" height="132"/>

  <text x="44" y="606" class="mono" font-size="11" letter-spacing="1" fill="#8d8d9a">INDEPENDENT · NOT AFFILIATED WITH ELEKTRON</text>
</svg>
<script>
// Refuse a render with fallback fonts or a missing mark.
const markLoaded = new Promise(resolve => {
  const probe = new Image()
  probe.onload = () => resolve(true)
  probe.onerror = () => resolve(false)
  probe.src = '../../public/modwerk-mark.svg'
})
Promise.all([document.fonts.ready, markLoaded]).then(([, mark]) => {
  const fonts = document.fonts.check('720 94px Archivo') && document.fonts.check('400 20px "JetBrains Mono"')
    && [...document.fonts].every(face => face.status === 'loaded')
  document.documentElement.dataset.rendered = fonts && mark ? 'true' : fonts ? 'mark-error' : 'font-error'
})
</script>
</body>
</html>
