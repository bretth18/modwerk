  <title id="title">EUCLID SEQ — Euclidean trigs</title>
  <desc id="description">Original illustration: two 16-step Euclidean generators, 5 and 3 pulses, and their XOR written as trigs on a track. This is an illustration, not an Octatrack screenshot.</desc>
  <rect width="320" height="192" rx="14" fill="#202025"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#a5a2b4">
    <text x="24" y="24" fill="#ece8f6" font-size="10" letter-spacing="1.4">EUCLID SEQ</text>
    <text x="190" y="24">TRIG EDIT ▸ RIGHT</text>
    <text x="24" y="176">PL · RO · TRO · OR XOR AND SUB</text>
    <text x="24" y="64">PL1 5</text>
    <text x="24" y="98">PL2 3</text>
    <text x="24" y="132">XOR</text>
  </g>
